version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # react and react-dom must always be the exact same version; separate PRs can never pass CI.
      react:
        patterns: ['react', 'react-dom']
    ignore:
      # Types must match the Node we run (CI: Node 22); bump the major together with the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
