name: CI

on:
  push:
    branches: [main]
  pull_request:

# gitleaks-action@v2 lists a PR's commits via the API, which needs pull-requests: read
# (see the action's README, "Usage Example"). Everything else is least-privilege read.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Secret scan first so it is never hidden behind other failures.
      # Personal repos need no license; org-owned repos need a GITLEAKS_LICENSE secret.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: mms
        name: Resolve mongodb-memory-server version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/mongodb-memory-server'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-binaries-${{ runner.os }}-${{ steps.mms.outputs.version }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Build + e2e
        run: npm run e2e # tests/e2e/server.ts runs `next build` then `next start`
      # Gate on shipped (production) dependencies. See README "Known audit exceptions".
      - run: npm audit --omit=dev --audit-level=high
      # Full audit incl. dev deps: visible but non-blocking (braces GHSA-vfj7-8cjw-p6xm has no patched release).
      - run: npm audit --audit-level=high
        continue-on-error: true
